    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitulo {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        input[type="date"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            transition: 0.3s;
        }

        input[type="date"]:focus {
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 2px #ff9a9e;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 154, 158, 0.4);
        }

        #resultado {
            margin-top: 30px;
            padding: 25px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.07);
            display: none;
            animation: fadeIn 0.5s ease;
            text-align: left;
        }

        #nomeSigno {
            font-size: 1.7rem;
            color: #ff9a9e;
            text-align: center;
            margin-bottom: 5px;
        }

        #datas {
            text-align: center;
            color: #fad0c4;
            font-size: 0.95rem;
            margin-bottom: 18px;
        }

        .info-item {
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .info-item strong {
            color: #fad0c4;
        }

        .idade {
            text-align: center;
            font-size: 1.15rem;
            color: #ff9a9e;
            font-weight: 600;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Descubra seu Signo</h1>
        <p class="subtitulo">Informe sua data de nascimento</p>

        <input type="date" id="dataNascimento">

        <button onclick="descobrirSigno()">Descobrir Signo</button>

        <div id="resultado">
            <h2 id="nomeSigno"></h2>
            <p id="datas"></p>
            
            <div class="info-item"><strong>Elemento:</strong> <span id="elemento"></span></div>
            <div class="info-item"><strong>Modalidade:</strong> <span id="modalidade"></span></div>
            <div class="info-item"><strong>Planeta Regente:</strong> <span id="planeta"></span></div>
            <div class="info-item"><strong>Personalidade:</strong> <span id="descricao"></span></div>
            <div class="info-item"><strong>Pontos Fortes:</strong> <span id="fortes"></span></div>
            <div class="info-item"><strong>Pontos Fracos:</strong> <span id="fracos"></span></div>
            <div class="info-item"><strong>Cor da Sorte:</strong> <span id="cor"></span></div>
            <div class="info-item"><strong>Número da Sorte:</strong> <span id="numero"></span></div>
            
            <p class="idade" id="idade"></p>

    </div>

        function calcularIdade(dataNascimento) {
            const hoje = new Date();
            let idade = hoje.getFullYear() - dataNascimento.getFullYear();
            const mes = hoje.getMonth() - dataNascimento.getMonth();
            
            if (mes < 0 || (mes === 0 && hoje.getDate() < dataNascimento.getDate())) {
                idade--;
            }
            return idade;
        }

        function descobrirSigno() {
            const dataInput = document.getElementById("dataNascimento").value;
            
            if (!dataInput) {
                alert("Por favor, selecione uma data!");
                return;
            }

            const data = new Date(dataInput + "T00:00:00");
            const dia = data.getDate();
            const mes = data.getMonth() + 1;

            let signoEncontrado = null;

            for (let signo of signos) {
                const [mesInicio, diaInicio] = signo.inicio;
                const [mesFim, diaFim] = signo.fim;

                if (mesInicio > mesFim) { // Capricórnio
                    if ((mes === mesInicio && dia >= diaInicio) || (mes === mesFim && dia <= diaFim)) {
                        signoEncontrado = signo;
                        break;
                    }
                } else {
                    if ((mes === mesInicio && dia >= diaInicio) || 
                        (mes === mesFim && dia <= diaFim) || 
                        (mes > mesInicio && mes < mesFim)) {
                        signoEncontrado = signo;
                        break;
                    }
                }
            }

            if (signoEncontrado) {
                const idade = calcularIdade(data);
                
                document.getElementById("nomeSigno").textContent = `${signoEncontrado.emoji} ${signoEncontrado.nome}`;
                document.getElementById("datas").textContent = signoEncontrado.datas;
                document.getElementById("elemento").textContent = signoEncontrado.elemento;
                document.getElementById("modalidade").textContent = signoEncontrado.modalidade;
                document.getElementById("planeta").textContent = signoEncontrado.planeta;
                document.getElementById("descricao").textContent = signoEncontrado.descricao;
                document.getElementById("fortes").textContent = signoEncontrado.fortes;
                document.getElementById("fracos").textContent = signoEncontrado.fracos;
                document.getElementById("cor").textContent = signoEncontrado.cor;
                document.getElementById("numero").textContent = signoEncontrado.numero;
                document.getElementById("idade").textContent = `Idade: ${idade} anos`;

            }
